name: Verify CivicPulse frontend Linux build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Clean install (including native optional dependencies)
        run: npm ci --include=optional
      - name: Check native Rollup module and build
        run: npm run build
